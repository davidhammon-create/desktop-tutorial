<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta
      name="description"
      content="Interaktive 3D-Modelle auf Universitätsniveau für Physik, Chemie, Biologie und Medizin."
    />
    <title>Modellsammlung – Interaktive 3D-Modelle für das Studium</title>

    <!-- Farbe der Browser- bzw. Systemleiste im installierten Zustand -->
    <meta name="theme-color" content="#0d1120" />

    <!-- iOS kennt kein Web-App-Manifest für den Vollbildstart; dort steuern
         diese Angaben das Verhalten nach "Zum Home-Bildschirm hinzufügen". -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Modellsammlung" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Bewusst ohne Web-Font von einem CDN: Die Seite soll auch offline und hinter
      restriktiven Netzwerken vollständig funktionieren. Die Schriftauswahl in
      styles.css nutzt die Systemschriften.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1120'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%235b8def'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='5.2' fill='none' stroke='%239775fa' stroke-width='1.6'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='5.2' fill='none' stroke='%2351cf66' stroke-width='1.6' transform='rotate(60 16 16)'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='5.2' fill='none' stroke='%23ff6b6b' stroke-width='1.6' transform='rotate(120 16 16)'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
